name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r scripts/image-requirements.txt
      - run: npm test
        env:
          PET_SKIP_ENV: "1"
          PET_ENABLE_GENERATION: "0"
          PET_ENABLE_TRIPS: "0"
          PET_IMAGE_PYTHON: python
      - run: npm run check:evolution
        env:
          PET_IMAGE_PYTHON: python
